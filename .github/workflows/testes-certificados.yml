name: Testes de certificados

on:
  pull_request:
    paths:
      - "gerar_certificados.py"
      - "tests/**"
      - ".github/workflows/testes-certificados.yml"
  push:
    branches: [master]
    paths:
      - "gerar_certificados.py"
      - "tests/**"
      - ".github/workflows/testes-certificados.yml"

jobs:
  certificados:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencia de planilhas
        run: python -m pip install openpyxl
      - name: Executar testes sem Outlook
        run: python -m unittest discover -s tests -v
